name: Bug report
description: Something doesn't work as expected (NOT for security issues; see SECURITY.md)
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Umbra version, description: "Browser/umbra_version.json or about:support → umbra.version" }
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: Platform, placeholder: "Ubuntu 24.04 x86-64" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information, onion addresses I don't want public, and IP addresses from this report
          required: true
