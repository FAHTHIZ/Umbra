name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, geckodriver: linux64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, geckodriver: linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    env: { UMBRA_PLATFORM: "${{ matrix.platform }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 gnupg xz-utils
      - run: pip install -r requirements-dev.txt
      - run: curl -sSfL https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-${{ matrix.geckodriver }}.tar.gz | sudo tar xz -C /usr/local/bin
      - run: python -m pytest -q tests/unit
      - run: python -m tools.umbra_build build --platform ${{ matrix.platform }}
      - run: python -m pytest -q tests/integration tests/leak
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.xz

  build-windows:
    runs-on: windows-2025
    env: { UMBRA_PLATFORM: windows-x86_64 }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: geckodriver
        run: |
          curl -sSfL -o gd.zip https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-win64.zip
          mkdir -p "$HOME/bin" && python -c "import zipfile;zipfile.ZipFile('gd.zip').extractall(r'$HOME/bin')"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: gpg (Git for Windows ships one)
        run: gpg --version | head -1
      - run: python -m pytest -q tests/unit
      - run: python -m tools.umbra_build build --platform windows-x86_64
      - run: python -m pytest -q tests/integration
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*.zip

  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "release-*", merge-multiple: true }
      - name: SHA256SUMS
        run: cd dist && sha256sum *.tar.xz *.zip | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - name: Publish GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/*.tar.xz dist/*.zip dist/SHA256SUMS \
            --title "Umbra ${TAG#v}" --notes-file docs/RELEASE_NOTES.md --verify-tag || \
          gh release upload "$TAG" dist/*.tar.xz dist/*.zip dist/SHA256SUMS --clobber
