name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every main commit gets a complete run (commits land directly on main);
  # superseded runs on other refs are cancelled.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/unit

  build-and-test:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, geckodriver: linux64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, geckodriver: linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    env: { UMBRA_PLATFORM: "${{ matrix.platform }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System deps (GTK runtime for headless Gecko)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 gnupg xz-utils hashdeep libimage-exiftool-perl
      - run: pip install -r requirements-dev.txt
      - name: Evidence interop tools (mitmproxy HAR reader, bundle decryption)
        run: pip install "mitmproxy==12.3.1" "cryptography>=42"
      - name: geckodriver
        run: |
          curl -sSfL https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-${{ matrix.geckodriver }}.tar.gz | sudo tar xz -C /usr/local/bin
      - uses: actions/cache@v4
        with:
          path: .cache/*.tar.xz*
          key: upstream-${{ matrix.platform }}-${{ hashFiles('upstream/tor-browser.lock.json') }}
      - name: Build (verifies upstream signature + sha256)
        run: python -m tools.umbra_build build --platform ${{ matrix.platform }}
      - name: Integration tests (incl. fingerprint parity vs upstream)
        run: python -m pytest -q tests/integration
      - name: Network leak tests
        run: python -m pytest -q tests/leak
      - name: Benchmark vs upstream
        if: matrix.platform == 'linux-x86_64'
        run: python bench/benchmark.py --runs 5 --out bench/results/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            dist/*.tar.xz
            dist/SHA256SUMS
            bench/results/ci.json

  windows:
    needs: unit
    runs-on: windows-2025
    env: { UMBRA_PLATFORM: windows-x86_64 }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: geckodriver
        run: |
          curl -sSfL -o gd.zip https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-win64.zip
          mkdir -p "$HOME/bin" && python -c "import zipfile;zipfile.ZipFile('gd.zip').extractall(r'$HOME/bin')"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: gpg (Git for Windows ships one)
        run: gpg --version | head -1
      - uses: actions/cache@v4
        with:
          path: .cache/*.exe*
          key: upstream-windows-x86_64-${{ hashFiles('upstream/tor-browser.lock.json') }}
      - name: Build (verifies upstream signature + sha256)
        run: python -m tools.umbra_build build --platform windows-x86_64
      - name: Integration tests (incl. fingerprint parity vs upstream Tor Browser for Windows)
        run: python -m pytest -q tests/integration
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-windows-x86_64
          path: dist/*.zip

  live-tor:
    runs-on: ubuntu-24.04
    needs: build-and-test
    continue-on-error: true   # Tor network reachability varies; never gate merges on it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 gnupg xz-utils
      - run: pip install -r requirements-dev.txt
      - run: curl -sSfL https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz | sudo tar xz -C /usr/local/bin
      - uses: actions/cache@v4
        with:
          path: .cache/*.tar.xz*
          key: upstream-${{ hashFiles('upstream/tor-browser.lock.json') }}
      - run: python -m tools.umbra_build build --no-package
      - name: Live Tor tests (bootstrap, IsTor, onion navigation, default search)
        env: { UMBRA_LIVE_TOR: "1" }
        run: python -m pytest -q tests/live

  toolkit:
    # Container isolation for third-party investigation tools: internal network, onion-only Tor
    # SOCKS port, network-less analysis container with pinned exiftool/hashdeep/mitmproxy.
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Self-test (isolation + offline analysis + live onion-only Tor)
        env: { UMBRA_TOOLKIT_LIVE: "1" }
        run: bash toolkit/selftest.sh
      - name: Build the remaining tool images from their pinned commits
        continue-on-error: true   # upstream dependency drift must not hide the isolation result
        run: |
          failed=""
          for s in torbot darkdump darkspider onionscout onionscan; do
            if docker compose -f toolkit/compose.yaml --profile tools build "$s"; then
              docker compose -f toolkit/compose.yaml --profile tools run --rm --no-deps "$s" --help > "/tmp/$s.help" 2>&1 \
                && echo "OK $s (built, --help runs)" || { echo "WARN $s built but --help failed"; tail -5 "/tmp/$s.help"; }
            else failed="$failed $s"; fi
          done
          [ -z "$failed" ] || { echo "image build failed:$failed"; exit 1; }

  android:
    # Rebrand + re-sign the verified Tor Browser for Android APKs, then boot the x86_64 one
    # in an emulator: install next to Tor Browser, launch, connect to Tor, load pages.
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            .cache/*.apk*
            .cache/apktool_*.jar
          key: android-${{ hashFiles('upstream/tor-browser.lock.json') }}
      - name: Build Umbra for Android (x86_64 for the emulator, aarch64 for phones)
        run: |
          echo "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1):$PATH"
          python -m tools.umbra_build build --platform android-x86_64
          python -m tools.umbra_build build --platform android-aarch64
          ls -la dist/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test (install, launch, Tor bootstrap, page load)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python tests/android/smoke.py dist/umbra-*-android-x86_64*.apk --out android-artifacts --tor || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umbra-android
          if-no-files-found: ignore
          path: |
            dist/*.apk
            dist/*.apk.json
            android-artifacts/
